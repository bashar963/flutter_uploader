name: flutter_uploader_example
version: 3.0.0-beta.4
description: Demonstrates how to use the flutter_uploader plugin.
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.6
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.5.0
  flutter_uploader:
    path: ../
  equatable: ^2.0.7

dev_dependencies:
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
